<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" fill="none">
  <g class="colorable" data-name="folder" data-type="main">
    <!-- Folder back -->
    <path d="M30 130 L30 50 L80 30 L90 40 L170 40 L170 120 L30 130Z" class="fill-primary" fill="#F0DFA0" stroke="#2D2D2D" stroke-width="2"/>
    <!-- Folder tab -->
    <path d="M30 50 L80 30 L90 40 L50 55Z" class="fill-secondary" fill="#E5D090" stroke="#2D2D2D" stroke-width="2"/>
    <!-- Paper 1 -->
    <path d="M50 115 L50 55 L140 45 L140 105 Z" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="1.5"/>
    <!-- Paper lines -->
    <line x1="60" y1="65" x2="130" y2="57" stroke="#CCCCCC" stroke-width="1"/>
    <line x1="60" y1="75" x2="130" y2="67" stroke="#CCCCCC" stroke-width="1"/>
    <line x1="60" y1="85" x2="110" y2="79" stroke="#CCCCCC" stroke-width="1"/>
    <!-- Folder front -->
    <path d="M25 135 L25 70 L170 55 L170 125 Z" class="fill-accent" fill="#F5E8B0" stroke="#2D2D2D" stroke-width="2" opacity="0.85"/>
    <!-- Sticker -->
    <circle cx="45" cy="105" r="6" class="fill-highlight" fill="#FF6B8A"/>
  </g>
</svg>
